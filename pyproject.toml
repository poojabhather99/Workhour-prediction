[project]
name = "workhour"
version = "1.0.0"
description = "Software project effort estimation with cross-validated ML models and a Streamlit app"
requires-python = ">=3.10"
dependencies = ["pandas>=2.0", "scikit-learn>=1.3", "joblib>=1.3", "streamlit>=1.30"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
